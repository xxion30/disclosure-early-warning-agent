x-backend: &backend
  restart: unless-stopped
  image: dartch-backend:${RELEASE_TAG:-local}
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &env
    APP_ENV: production
    DB_URL: postgresql+psycopg://dartch:${POSTGRES_PASSWORD:-dartch}@postgres:5432/dartch
    CHECKPOINT_DB: postgresql://dartch:${POSTGRES_PASSWORD:-dartch}@postgres:5432/dartch
    QUEUE_ENABLED: "false"
    COLLECT_DISPATCH_ENABLED: ${COLLECT_DISPATCH_ENABLED:-false}
    PHASE1_RUNTIME_FACTORY: ${PHASE1_RUNTIME_FACTORY:-agent.hosted:build_runtime}
    BUSINESS_MCP_URL: http://business:8001/mcp
    RAG_MCP_URL: http://rag:8002/mcp
    GRAPH_ADAPTER: real
    RAG_INDEX_MODE: ephemeral
    LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    LLM_PRIMARY: ${LLM_PRIMARY:-gpt-5.4-mini}
    LLM_FALLBACK: ${LLM_FALLBACK:-gpt-5.4-mini}
    JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-sharing}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    DART_API_KEY: ${DART_API_KEY:-}
    MCP_HOST: 0.0.0.0
  depends_on:
    postgres:
      condition: service_healthy
services:
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_USER: dartch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartch}
      POSTGRES_DB: dartch
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartch -d dartch"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      business:
        condition: service_healthy
      rag:
        condition: service_healthy
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20
  business:
    <<: *backend
    command: ["python", "-m", "mcp_servers.business.server"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.ops.mcp_health", "http://127.0.0.1:8001/mcp"]
      interval: 5s
      timeout: 10s
      retries: 20
  rag:
    <<: *backend
    command: ["python", "-m", "mcp_servers.rag.server"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.ops.mcp_health", "http://127.0.0.1:8002/mcp"]
      interval: 5s
      timeout: 10s
      retries: 20
  collector:
    <<: *backend
    profiles: ["integration"]
    command: ["python", "-m", "collector", "--schedule"]
    depends_on:
      api:
        condition: service_healthy
    # R3 collector entrypoint; explicit daily schedule, no queue.
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: ["legacy-queue"]
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
volumes:
  postgres-data:
  rabbitmq-data:
  web-modules:
