name: dartch-local-demo

x-backend: &backend
  image: dartch-local-demo-backend
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  environment: &env
    APP_ENV: development
    DB_URL: postgresql+psycopg://demo_owner:local-demo-only@postgres:5432/dartch_demo
    CHECKPOINT_DB: postgresql://demo_owner:local-demo-only@postgres:5432/dartch_demo
    BUSINESS_MCP_URL: http://business:8001/mcp
    RAG_MCP_URL: http://rag:8002/mcp
    MCP_HOST: 0.0.0.0
    GRAPH_ADAPTER: real
    PHASE1_RUNTIME_FACTORY: agent.hosted:build_runtime
    RAG_INDEX_MODE: ephemeral
    QUEUE_ENABLED: "false"
    COLLECT_DISPATCH_ENABLED: "true"
    LANGSMITH_TRACING: "false"
    FAKE_LLM_ERROR: ""
    FAKE_UNSAFE_DRAFT: "false"
  volumes: ["session:/run/dartch-demo"]
  entrypoint: ["python", "-m", "scripts.ops.demo_entrypoint"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: demo_owner
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: postgres
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_owner -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  prepare:
    <<: *backend
    entrypoint: ["python", "-m", "scripts.ops.prepare_demo"]
    restart: "no"
    profiles: ["setup"]
    depends_on:
      postgres:
        condition: service_healthy
  business:
    <<: *backend
    command: ["python", "-m", "mcp_servers.business.server"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.ops.mcp_health", "http://127.0.0.1:8001/mcp"]
      interval: 5s
      timeout: 15s
      retries: 40
  rag:
    <<: *backend
    command: ["python", "-m", "mcp_servers.rag.server"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.ops.mcp_health", "http://127.0.0.1:8002/mcp"]
      interval: 5s
      timeout: 15s
      retries: 40
  api:
    <<: *backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      business:
        condition: service_healthy
      rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 3s
      timeout: 5s
      retries: 40
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_LOCAL_DEMO: "true"
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  session:
